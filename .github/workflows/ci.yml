name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax & Smoke Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check JS syntax
        shell: bash
        run: |
          node --check bin/crypt-sync.js
          for f in cmd/*.js lib/*.js scripts/postinstall.js; do node --check "$f"; done

      - name: Install (skip postinstall in CI — no age needed for syntax check)
        run: npm install --ignore-scripts

      - name: Version smoke test
        run: node bin/crypt-sync.js --version

      # --- Claude Code plugin layer (does not ship in the npm package) ---

      - name: Plugin gate — self test
        if: runner.os != 'Windows'
        run: sh hooks/require-cli.sh --self-test

      - name: Plugin gate — covers every CLI command
        if: runner.os == 'Linux' && matrix.node == '20'
        run: node hooks/check-gate-sync.js

      - name: npm tarball carries no plugin-only files
        if: runner.os == 'Linux' && matrix.node == '20'
        shell: bash
        run: |
          # package.json `files` is a whitelist, so .claude-plugin/, skills/ and
          # hooks/ stay out of the tarball. If that whitelist is ever dropped,
          # .npmignore takes over and these would silently start shipping.
          if npm pack --dry-run 2>&1 | grep -Eq '\.claude-plugin|[[:space:]]skills/|hooks/(hooks\.json|require-cli|check-gate)'; then
            echo "FAIL: plugin-only files leaked into the npm tarball"
            exit 1
          fi
          echo "ok: tarball contains no plugin-only files"
